name: Ramps

# Weekly refresh of slipways / boat ramps from OpenStreetMap (ODbL) for ES, PT and FR (islands included):
# one Overpass query, committed to data/ramps/ramps.json. The forecast build publishes it as
# v1/ramps/{tile}.json on its next run. A much shorter answer (partial Overpass result) is not committed.
on:
  schedule:
    - cron: "45 5 * * 1"   # Monday, before links.yml (06:15) and the 10:00 forecast
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ramps
  cancel-in-progress: false

jobs:
  ramps:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install --quiet requests
      - name: Query Overpass
        run: python -m fishershour_pipeline.ramps --out data/ramps/ramps.json
      - name: Commit
        run: |
          git config user.name "fishershour-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ramps/ramps.json
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -qm "data: refresh OpenStreetMap slipways"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0; sleep 5; done
          exit 1
